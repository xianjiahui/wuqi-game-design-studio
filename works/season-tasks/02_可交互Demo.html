(function(root,factory){const api=factory();if(typeof module==='object'&&module.exports)module.exports=api;if(root)root.DemoCFG=api;})(typeof globalThis!=='undefined'?globalThis:this,function(){
'use strict';const generator=(function(){
// Pure browser/Node module. Player inputs contain no curve, seed, fees, or tuning controls.
const VERSION='CFG-0.3.0';
const PREFERENCE_IDS=Object.freeze(['container_search','point_investigation','npc_kill','in_raid_activity','carry_out','task_item_actions','operator_kill','production_submission']);
const MAP_IDS=Object.freeze(['dam','valley','spacebase','bakesh','az3']);
const EVENTS={container_search:'container_first_open',point_investigation:'investigation_complete',npc_kill:'npc_kill',in_raid_activity:'activity_complete',carry_out:'holder_item_extracted',task_item_actions:'task_item_chain_completed',operator_kill:'operator_kill',production_submission:'production_submission_completed'};
const MODES={dam:['机密','永夜'],valley:['机密'],spacebase:['机密','绝密'],bakesh:['机密','绝密'],az3:['机密']};
const WINDOWS={container_search:'CROSS_MATCH',point_investigation:'CROSS_MATCH',npc_kill:'CROSS_MATCH',in_raid_activity:'CROSS_MATCH',carry_out:'SINGLE_MATCH',task_item_actions:'SINGLE_MATCH',operator_kill:'CROSS_MATCH',production_submission:'OUT_OF_RAID'};
const ACTIONS={container_search:['container_first_open'],point_investigation:['investigation_complete'],npc_kill:['npc_kill'],in_raid_activity:['activity_complete'],carry_out:['holder_item_extracted'],task_item_actions:['holder_acquire_task_item','holder_place_task_item','holder_transfer_task_item'],operator_kill:['operator_kill'],production_submission:['holder_produce_item','holder_submit_item']};
const check=(condition,message,code='CONFIG_INVALID')=>{if(!condition)throw Object.assign(new Error(message),{code});};
const clone=x=>JSON.parse(JSON.stringify(x));
const finite=x=>typeof x==='number'&&Number.isFinite(x);
const text=x=>typeof x==='string'&&x.length>0;
const sorted=xs=>[...xs].sort();
const same=(a,b)=>JSON.stringify(sorted(a))===JSON.stringify(sorted(b));
const scope=id=>['npc_kill','in_raid_activity'].includes(id)?'team_progress':'self_only';
function stable(x){if(Array.isArray(x))return '['+x.map(stable).join(',')+']';if(x&&typeof x==='object')return '{'+Object.keys(x).sort().map(k=>JSON.stringify(k)+':'+stable(x[k])).join(',')+'}';return JSON.stringify(x);}
function hash(x){let n=2166136261;for(const ch of typeof x==='string'?x:stable(x))n=Math.imul(n^ch.charCodeAt(0),16777619)>>>0;return n.toString(16).padStart(8,'0');}
function unique(rows,key,name){const ids=rows.map(key);check(ids.every(text)&&new Set(ids).size===ids.length,`${name}主键缺失或重复`);}
function listCheck(v,name){check(Array.isArray(v)&&v.length>0&&v.every(text)&&new Set(v).size===v.length,`${name}缺失或重复`,'REQUEST_INVALID');}
const TABLES=['stages','maps','behaviors','templates','targetDetails','locationPools','availability','strategies','behaviorWeights','intensity','validationRules'];
const preparedConfigs=new WeakMap();
const LOCATION_BEHAVIORS=['point_investigation','carry_out','task_item_actions'];
const DIRECTIONS=['东侧','西侧','南侧','北侧'];
const USER_PLACE_NAMES={dam:['行政楼东楼','行政楼西楼','集装箱','小军营','军营','河滩','变电站'],bakesh:['集市','营地','浴场','博物馆','旅店','停车场','巴别塔','海洋中心','审讯室'],az3:['餐厅','反应堆总控室','仿星加速器','压水堆','冷却堆','火力发电站','老科学院','运输仓库'],valley:['皇后酒店','雷达站','火车站','小镇','庄园','河边','坠机之地','储藏站'],spacebase:['福利室','蓝室','离心机室','黑市','总裁办公室','中控楼','员工宿舍','组装室','吊装室','发射平台','运输重心','员工通道']};
const locationsFor=(c,mapId)=>c.locationPools.filter(p=>p.enabled===1&&p.map_id===mapId).flatMap(p=>p.directions.map((direction,i)=>({locationId:`${p.location_id}_${i+1}`,mapId,placeName:p.place_name,direction,label:p.place_name+direction})));
const locationCapacity=(c,mapId)=>c.locationPools.filter(p=>p.enabled===1&&p.map_id===mapId).reduce((n,p)=>n+p.directions.length,0);
const contentCanonical=c=>preparedConfigs.get(c)?.canonical??stable(Object.fromEntries(TABLES.map(k=>[k,[...c[k]].map(r=>k==='stages'?{...r,stars:[...r.stars].sort((a,b)=>a-b)}:r).sort((a,b)=>stable(a).localeCompare(stable(b)))])));
function contentFingerprint(c){return preparedConfigs.get(c)?.fingerprint??hash(contentCanonical(c));}
function prepareConfig(c){if(preparedConfigs.has(c))return c;validateConfig(c);const next=clone(c),canonical=contentCanonical(next);const freeze=value=>{if(value&&typeof value==='object'){Object.freeze(value);for(const child of Object.values(value))freeze(child);}return value;};freeze(next);preparedConfigs.set(next,{canonical,fingerprint:hash(canonical)});return next;}
function validateConfig(c){
  if(preparedConfigs.has(c))return true;
  check(c?.metadata?.configVersion===VERSION&&c.metadata.schemaVersion==='PLAYER-LINE-V3'&&c.metadata.eventProtocolVersion==='DEMO-ACTIONS-V3','配置/线规格/事件协议版本不兼容','VERSION_UNSUPPORTED');
  for(const t of TABLES)check(Array.isArray(c[t])&&c[t].length>0,`${t}表缺失`);
  unique(c.stages,r=>String(r.stage),'阶段');unique(c.maps,r=>r.map_id,'地图');unique(c.behaviors,r=>r.behavior_id,'行为');unique(c.templates,r=>r.template_id,'模板');
  unique(c.targetDetails,r=>r.detail_id,'目标明细');
  unique(c.locationPools,r=>r.location_id,'地点命名池');unique(c.locationPools,r=>`${r.map_id}|${r.place_name}`,'地图地点名');
  unique(c.availability,r=>`${r.stage}|${r.option_type}|${r.option_id}`,'可选项');unique(c.strategies,r=>String(r.stage),'策略');unique(c.intensity,r=>String(r.stage),'强度');unique(c.behaviorWeights,r=>`${r.stage}|${r.behavior_id}`,'行为权重');unique(c.validationRules,r=>r.rule_id,'硬规则');
  check(same(c.stages.map(s=>s.stage),[1,2,3])&&same(c.maps.map(m=>m.map_id),MAP_IDS)&&same(c.behaviors.map(b=>b.behavior_id),PREFERENCE_IDS),'阶段/地图/行为词表不兼容');
  const requiredRules=['only_player_three_inputs','all_displayed_legal_combinations','theme_each_selected_preference','selected_maps_cover_all_except_production_only','scope_whitelist','no_unselected_primary_behavior','planner_only_difficulty_preset','deterministic_content','generation_fee_zero','expiry_three_simulated_days','no_player_curve_or_seed','config_change_resets_player_state'];
  check(same(c.validationRules.map(r=>r.rule_id),requiredRules)&&c.validationRules.every(r=>r.enabled===1),'确认规则缺失或被禁用');
  for(const m of c.maps)check(same(m.legal_modes,MODES[m.map_id])&&m.legal_modes.includes(m.default_mode),'内部地图模式非法');
  for(const b of c.behaviors)check(b.event_type===EVENTS[b.behavior_id]&&b.scope===scope(b.behavior_id)&&b.in_raid===Number(b.behavior_id!=='production_submission')&&b.window===WINDOWS[b.behavior_id]&&finite(b.unit_pressure)&&b.unit_pressure>0&&b.unit_pressure<=100&&JSON.stringify(b.required_actions)===JSON.stringify(ACTIONS[b.behavior_id]),'行为协议/主体/强度非法');
  for(const s of c.stages){
    check(s.threshold===({1:7,2:10,3:14})[s.stage]&&Array.isArray(s.stars)&&s.stars.length>0&&s.stars.every(x=>Number.isSafeInteger(x)&&x>0&&x<=s.threshold)&&new Set(s.stars).size===s.stars.length,'阶段门槛或展示星档非法');
    check(Number.isSafeInteger(s.node_count)&&s.node_count>=4&&s.node_count<=12,'节点数须能容纳三偏好及双图主题分配');
    const strategy=c.strategies.filter(r=>r.stage===s.stage),f=c.intensity.filter(r=>r.stage===s.stage);
    check(strategy.length===1&&f.length===1,'阶段策略/强度引用缺失');const p=strategy[0],v=f[0];
    check(['flat','progressive'].includes(p.difficulty_preset)&&p.preference_coverage==='theme_each'&&p.production_only_map_policy==='exempt'&&p.generation_fee===0&&p.expiry_days===3&&p.expiry_clock==='demo_simulation'&&p.deterministic===1,'策划预设或用户确认规则非法');
    check([v.base_target_per_node,v.progressive_start,v.progressive_end,v.flat_factor].every(finite)&&v.base_target_per_node>0&&v.base_target_per_node<=100&&v.star_baseline===Math.max(...s.stars)&&v.progressive_start>0&&v.progressive_end>v.progressive_start&&v.progressive_end<=3&&v.flat_factor===1,'强度预设非法');
    const rows=c.availability.filter(r=>r.stage===s.stage);check(rows.length===MAP_IDS.length+PREFERENCE_IDS.length,'阶段可选项不完整');
    for(const row of rows)check([0,1].includes(row.enabled)&&((row.option_type==='map'&&MAP_IDS.includes(row.option_id))||(row.option_type==='behavior'&&PREFERENCE_IDS.includes(row.option_id))),'未知可选项或开关非法');
    const ws=c.behaviorWeights.filter(r=>r.stage===s.stage);check(same(ws.map(r=>r.behavior_id),PREFERENCE_IDS)&&ws.every(r=>finite(r.relative_weight)&&r.relative_weight>0),'行为权重缺失/非法');
  }

function presetLineRef(lineId){must(nonempty(lineId),'预设线ID为空');return `preset:${encodeURIComponent(lineId)}`;}
function generatedLineRef(instanceId){must(nonempty(instanceId),'自选实例ID为空');return `generated:${encodeURIComponent(instanceId)}`;}
function generatedNodeRef(instanceId,nodeId){must(nonempty(nodeId),'自选节点ID为空');return `${generatedLineRef(instanceId)}/node:${encodeURIComponent(nodeId)}`;}
function createInitialProgressSnapshot(){return {schemaVersion:PROGRESS_SCHEMA,completedNodeIds:[],settlements:[]};}

function createDefaultModelConfig(){
  return {schemaVersion:MODEL_SCHEMA,parameterVersion:'PLANNING-WU-D1',nature:'D',
    presetNodeBaseUnitsByStage:{1:1,2:1.25,3:1.5},generatedNodeBaseUnitsByStage:{1:0.5,2:0.625,3:0.75},
    goalUnitByType:{container_search:0.35,point_investigation:0.6,npc_kill:0.15,in_raid_activity:1,carry_out:0.7,task_item_actions:0.8,operator_kill:1.2,production_submission:0.55},
    verifiedComplexity:{singleMatch:1.2,successfulExtraction:1.25},
    rangeMultipliers:{verified:[0.8,1.2],unknownConditions:[0.7,1.8]}};
}
const createModelConfig=createDefaultModelConfig;
function modelConfigToRows(model=createModelConfig()){
  validateModel(model);const rows=[];
  const add=(parameter_id,stage,goal_type,value,unit)=>rows.push({parameter_id,stage,goal_type,value,nature:'D',parameter_version:model.parameterVersion,unit});
  for(const stage of [1,2,3])add('preset_node_base',stage,'',model.presetNodeBaseUnitsByStage[stage],'planning_work_unit_per_node');
  for(const stage of [1,2,3])add('generated_node_base',stage,'',model.generatedNodeBaseUnitsByStage[stage],'planning_work_unit_per_node');
  for(const type of GOAL_TYPES)add('goal_unit',0,type,model.goalUnitByType[type],'planning_work_unit_per_goal_quantity');
  add('single_match_multiplier',0,'',model.verifiedComplexity.singleMatch,'multiplier');
  add('successful_extraction_multiplier',0,'',model.verifiedComplexity.successfulExtraction,'multiplier');
  for(const [field,id] of [['verified','verified'],['unknownConditions','unknown_conditions']]){
    add(`range_${id}_low`,0,'',model.rangeMultipliers[field][0],'multiplier');add(`range_${id}_high`,0,'',model.rangeMultipliers[field][1],'multiplier');
  }
  return rows;
}
function modelConfigFromRows(rows){
  must(Array.isArray(rows),'评价参数表须为数组','INVALID_MODEL');const model=createModelConfig();
  const expected=modelConfigToRows(model),key=r=>JSON.stringify([r.parameter_id,r.stage,r.goal_type]),seen=new Set();
  must(rows.length===expected.length,'评价参数表缺行或多行','INVALID_MODEL');
  const versions=unique(rows.map(r=>r.parameter_version));must(versions.length===1&&nonempty(versions[0]),'评价参数版本缺失或不一致','INVALID_MODEL');model.parameterVersion=versions[0];
  for(const row of rows){
    exactKeys(row,['parameter_id','stage','goal_type','value','nature','parameter_version','unit'],'评价参数行');
    const match=expected.find(r=>key(r)===key(row));must(match&&!seen.has(key(row)),'评价参数标识缺失、重复或未知','INVALID_MODEL');seen.add(key(row));
    must(row.nature==='D'&&row.unit===match.unit&&positive(row.value),'评价参数性质/单位/数值错误','INVALID_MODEL');
    if(row.parameter_id==='preset_node_base')model.presetNodeBaseUnitsByStage[row.stage]=row.value;
    else if(row.parameter_id==='generated_node_base')model.generatedNodeBaseUnitsByStage[row.stage]=row.value;
    else if(row.parameter_id==='goal_unit')model.goalUnitByType[row.goal_type]=row.value;
    else if(row.parameter_id==='single_match_multiplier')model.verifiedComplexity.singleMatch=row.value;
    else if(row.parameter_id==='successful_extraction_multiplier')model.verifiedComplexity.successfulExtraction=row.value;
    else {const field=row.parameter_id.includes('unknown_conditions')?'unknownConditions':'verified',index=row.parameter_id.endsWith('_low')?0:1;model.rangeMultipliers[field][index]=row.value;}
  }
  validateModel(model);return model;
}
function validateModel(model){
  exactKeys(model,['schemaVersion','parameterVersion','nature','presetNodeBaseUnitsByStage','generatedNodeBaseUnitsByStage','goalUnitByType','verifiedComplexity','rangeMultipliers'],'modelConfig');
  must(model.schemaVersion===MODEL_SCHEMA&&nonempty(model.parameterVersion)&&model.nature==='D','规划参数须为带版本的D模型','INVALID_MODEL');
  for(const field of ['presetNodeBaseUnitsByStage','generatedNodeBaseUnitsByStage']){exactKeys(model[field],['1','2','3'],field);must([1,2,3].every(s=>positive(model[field][s])),`${field}须含三阶段正数`,'INVALID_MODEL');}
  exactKeys(model.goalUnitByType,GOAL_TYPES,'goalUnitByType');
  must(model.goalUnitByType&&GOAL_TYPES.every(t=>positive(model.goalUnitByType[t])),'八类目标规划权重缺失或非正数','INVALID_MODEL');
  exactKeys(model.verifiedComplexity,['singleMatch','successfulExtraction'],'verifiedComplexity');
  must(['singleMatch','successfulExtraction'].every(t=>finite(model.verifiedComplexity[t])&&model.verifiedComplexity[t]>=1),'已核复杂系数须≥1','INVALID_MODEL');
  exactKeys(model.rangeMultipliers,['verified','unknownConditions'],'rangeMultipliers');
  for(const field of ['verified','unknownConditions']){const r=model.rangeMultipliers?.[field];must(Array.isArray(r)&&r.length===2&&r.every(positive)&&r[0]<=1&&r[1]>=1&&r[0]<=r[1],`${field}范围须为含点估计的正数区间`,'INVALID_MODEL');}
}

function factRegistry(catalog){

  for(const n of catalog.nodes){must(nonempty(n.id)&&!nodes.has(n.id)&&[1,2,3].includes(n.stage),'事实节点ID缺失/重复/阶段错误','INVALID_FACT_CATALOG');nodes.set(n.id,n);}
  for(const line of catalog.lines){
    must(nonempty(line.lineId)&&!lines.has(line.lineId)&&[1,2,3].includes(line.stage)&&['main','side','backup'].includes(line.lineType),'事实线ID/阶段/类型错误','INVALID_FACT_CATALOG');
    must(Array.isArray(line.nodeIds)&&line.nodeIds.length>0&&new Set(line.nodeIds).size===line.nodeIds.length&&line.nodeIds.every(id=>nodes.get(id)?.lineId===line.lineId&&nodes.get(id)?.stage===line.stage),'事实线节点引用错误','INVALID_FACT_CATALOG');
    must(line.lineType==='main'?line.stars===null:Number.isInteger(line.stars)&&line.stars>0,'事实线星数错误','INVALID_FACT_CATALOG');

  for(const stage of catalog.stages){must([1,2,3].includes(stage.stage)&&!stages.has(stage.stage)&&stage.threshold===({1:7,2:10,3:14})[stage.stage],'阶段门槛错误','INVALID_FACT_CATALOG');const mains=[...lines.values()].filter(l=>l.stage===stage.stage&&l.lineType==='main');must(mains.length===1&&mains[0].lineId===stage.mainLineId,'阶段没有唯一相符主线','INVALID_FACT_CATALOG');stages.set(stage.stage,stage);}
  must(stages.size===3,'事实阶段不完整','INVALID_FACT_CATALOG');

function makeRegistry(facts,generatedInstances){
  const refs=new Map(),nodeRefs=new Map(),instances=new Map();
  for(const line of facts.lines.values()){
    const ref=presetLineRef(line.lineId),entries=line.nodeIds.map(id=>({ref:id,source:facts.nodes.get(id),kind:'preset'}));
    const item={ref,id:line.lineId,stage:line.stage,kind:'preset',lineType:line.lineType,stars:line.stars,nodes:entries};refs.set(ref,item);
    for(const n of entries){must(!nodeRefs.has(n.ref),'节点完成ID碰撞','INVALID_FACT_CATALOG');nodeRefs.set(n.ref,{...n,lineRef:ref});}
  }
  const provided=generatedInstances??[];
  must(Array.isArray(provided)||(provided&&typeof provided==='object'),'generatedInstances须为数组或按实例索引的对象','INVALID_GENERATED_INSTANCE');
  const entries=Array.isArray(provided)?provided:Object.values(provided);
  for(const wrapper of entries){
    const spec=wrapper?.lineSpec??wrapper,instanceId=wrapper?.instanceId??spec?.instanceId;
    must(nonempty(instanceId)&&(!spec.instanceId||spec.instanceId===instanceId)&&!instances.has(instanceId),'自选实例ID缺失、重复或绑定冲突','INVALID_GENERATED_INSTANCE');
    must([1,2,3].includes(spec.stage)&&Number.isInteger(spec.stars)&&spec.stars>0&&Array.isArray(spec.nodes)&&spec.nodes.length>0,'自选线阶段/星数/节点非法','INVALID_GENERATED_INSTANCE');
    must(nonempty(spec.specId)&&spec.specId!==instanceId&&spec.lockedVersions&&typeof spec.lockedVersions==='object','自选规格/实例身份或版本锁缺失','INVALID_GENERATED_INSTANCE');
    const localIds=spec.nodes.map(n=>n.nodeId);must(localIds.every(nonempty)&&new Set(localIds).size===localIds.length,'自选线节点ID缺失或重复','INVALID_GENERATED_INSTANCE');
    for(const node of spec.nodes){
      must(Array.isArray(node.objectives)&&node.objectives.length>0,'自选节点没有结构化目标','INVALID_GENERATED_INSTANCE');
      for(const goal of node.objectives)must(GOAL_TYPES.includes(goal.goalType)&&Number.isInteger(goal.quantity)&&goal.quantity>0,'自选目标类型或数量非法','INVALID_GENERATED_INSTANCE');
    }
    const ref=generatedLineRef(instanceId),nodeEntries=spec.nodes.map(n=>({ref:generatedNodeRef(instanceId,n.nodeId),source:n,kind:'generated'}));
    const item={ref,id:instanceId,stage:spec.stage,kind:'generated',lineType:'generated',stars:spec.stars,nodes:nodeEntries,lockedVersions:spec.lockedVersions};
    refs.set(ref,item);instances.set(instanceId,item);
    for(const n of nodeEntries){must(!nodeRefs.has(n.ref),'自选节点完成ID碰撞','INVALID_GENERATED_INSTANCE');nodeRefs.set(n.ref,{...n,lineRef:ref});}
  }
  return {refs,nodeRefs,instances};
}

function readProgress(snapshot,registry){
  must(snapshot!==undefined&&snapshot!==null,'缺少只读进度快照；冷启动请显式调用createInitialProgressSnapshot()','PROGRESS_REQUIRED');
  exactKeys(snapshot,['schemaVersion','completedNodeIds','settlements'],'progressSnapshot');
  must(snapshot.schemaVersion===PROGRESS_SCHEMA&&Array.isArray(snapshot.completedNodeIds)&&Array.isArray(snapshot.settlements),'进度快照契约不符','INVALID_PROGRESS');
  const direct=new Set(),completed=new Set(),byReceipt=new Map(),bySource=new Map(),warnings=[];
  for(const id of snapshot.completedNodeIds){must(nonempty(id)&&registry.nodeRefs.has(id),`未知完成节点ID：${id}`,'INVALID_PROGRESS');direct.add(id);completed.add(id);}
  if(direct.size!==snapshot.completedNodeIds.length)warnings.push({code:'DUPLICATE_COMPLETED_NODE',ignored:snapshot.completedNodeIds.length-direct.size});
  for(const receipt of snapshot.settlements){
    exactKeys(receipt,['receiptId','stage','lineRef','stars'],'settlement');
    must(nonempty(receipt.receiptId)&&[1,2,3].includes(receipt.stage)&&nonempty(receipt.lineRef)&&Number.isInteger(receipt.stars)&&receipt.stars>0,'结算收据字段错误','INVALID_PROGRESS');
    const source=registry.refs.get(receipt.lineRef);must(source,'结算来源缺失；需要保留对应真实线或自选实例规格','INVALID_PROGRESS');
    must(source.lineType!=='main','主线不能产生支线星数收据','INVALID_PROGRESS');
    must(receipt.stage===source.stage&&receipt.stars===source.stars,'结算阶段或星数与权威来源不符','INVALID_PROGRESS');
    const signature=JSON.stringify({stage:receipt.stage,lineRef:receipt.lineRef,stars:receipt.stars});
    if(byReceipt.has(receipt.receiptId)){must(byReceipt.get(receipt.receiptId)===signature,'同收据ID内容冲突','INVALID_PROGRESS');warnings.push({code:'DUPLICATE_RECEIPT_ID',receiptId:receipt.receiptId});continue;}
    byReceipt.set(receipt.receiptId,signature);
    if(bySource.has(receipt.lineRef)){warnings.push({code:'DUPLICATE_SETTLEMENT_SOURCE',lineRef:receipt.lineRef,ignoredReceiptId:receipt.receiptId});continue;}
    bySource.set(receipt.lineRef,copy(receipt));
    const missing=source.nodes.filter(n=>!direct.has(n.ref));
    if(missing.length)warnings.push({code:'SETTLEMENT_PROVES_LINE_COMPLETION',lineRef:receipt.lineRef,inferredNodeCount:missing.length,basis:'整线有效结算收据证明该线已完成；completedNodeIds列表未列全'});
    for(const n of source.nodes)completed.add(n.ref);
  }
  return {direct,completed,bySource,warnings};
}

function estimateNode(entry,line,model){
  const unknowns=[],appliedFactors=[];let base,conditionsCovered=false,displayReviewed=false,quantityCoverage={covered:0,total:0},unmodeledGeneratedFields=[];
  if(entry.kind==='preset'){
    base=model.presetNodeBaseUnitsByStage[line.stage];displayReviewed=entry.source.displayReady===true;
    const traits=entry.source.verifiedTraits??{};
    for(const name of ['singleMatch','successfulExtraction'])if(traits[name]?.value===true&&traits[name]?.status==='reviewed_display_text'){
      base*=model.verifiedComplexity[name];appliedFactors.push({name,multiplier:model.verifiedComplexity[name],evidenceStatus:'reviewed_display_text',basis:traits[name].basis});
    }
    unknowns.push('预设节点只有文字与部分已核限制，无完整可执行条件树；不按关键词推断目标数量。');
    if(!displayReviewed)unknowns.push('节点展示文字仍待核对；节点级基础指数不依赖OCR细字。');
  }else{
    // 数量与大类可计算；对象子类、武器/装备、位置及交互成本未有参数，不因结构字段齐全就视为条件已建模。
    base=model.generatedNodeBaseUnitsByStage[line.stage];
    const legacyGoalFields=['goalId','goalType','primaryBehaviorId','title','description','eventType','scope','mapId','mode','quantity','targetIds','requiredActions','requiresSuccessfulExtraction','templateId'];
    const legacyNodeFields=['nodeId','sequence','title','themeId','primaryBehaviorId','window','incompleteReset','objectives','requiresSuccessfulExtraction'];
    unmodeledGeneratedFields=Object.keys(entry.source).filter(k=>!legacyNodeFields.includes(k)).map(k=>'node.'+k);
    for(const goal of entry.source.objectives){
      base+=goal.quantity*model.goalUnitByType[goal.goalType];quantityCoverage.total++;quantityCoverage.covered++;
      unmodeledGeneratedFields.push(...Object.keys(goal).filter(k=>!legacyGoalFields.includes(k)).map(k=>'goal.'+k));
    }
    unmodeledGeneratedFields=unique(unmodeledGeneratedFields);
    if(entry.source.window==='SINGLE_MATCH'){base*=model.verifiedComplexity.singleMatch;appliedFactors.push({name:'singleMatch',multiplier:model.verifiedComplexity.singleMatch,evidenceStatus:'generated_spec_D',basis:'lineSpec节点window=SINGLE_MATCH'});}
    const explicitExtraction=entry.source.requiresSuccessfulExtraction===true||entry.source.objectives.some(g=>g.requiresSuccessfulExtraction===true);
    if(explicitExtraction){base*=model.verifiedComplexity.successfulExtraction;appliedFactors.push({name:'successfulExtraction',multiplier:model.verifiedComplexity.successfulExtraction,evidenceStatus:'generated_spec_D',basis:'lineSpec显式requiresSuccessfulExtraction=true'});}
    unknowns.push('自选目标数量/类型为D规格；不证明真实点位、资源成本、完成率或对局耗时。');
    unknowns.push('自选仅按大类goalType、quantity与已建模单局/撤离因子粗估；对象细分、武器/装备条件、地点和交互绑定的额外成本未校准，完整条件覆盖为unknown。');
    if(unmodeledGeneratedFields.length)unknowns.push('未建模的自选规格字段：'+unmodeledGeneratedFields.join('、')+'；空值也不自动证明没有条件或成本。');
  }
  const multipliers=model.rangeMultipliers[conditionsCovered?'verified':'unknownConditions'];
  must(finite(base)&&finite(base*multipliers[1]),'规划参数累计溢出','INVALID_MODEL');
  return {nodeRef:entry.ref,lineRef:line.ref,kind:entry.kind,value:base,range:{low:base*multipliers[0],high:base*multipliers[1],kind:'parameter_scenario_range'},appliedFactors,
    coverage:{displayReviewed,presetExecutableConditionsCovered:false,generatedGoalQuantities:quantityCoverage,
      generatedExecutableConditionsCovered:false,generatedDetailedConditions:{covered:0,total:quantityCoverage.total},
      unmodeledGeneratedFields,conditionRangeBasis:conditionsCovered?'verified':'unknownConditions'},unknowns};
}
function planningMetric(estimates,isSufficient,model,basis){
  const display={displayLabel:'基础规划工作量（策划粗估）',shortLimit:'未计对象细分、武器/装备条件与地点额外代价',excludedFactors:['对象细分额外代价','武器/装备条件额外代价','地点额外代价']};
  const totals=estimates.reduce((a,n)=>({value:a.value+n.value,low:a.low+n.range.low,high:a.high+n.range.high}),{value:0,low:0,high:0});
  must(Object.values(totals).every(finite),'规划工作量总计溢出','INVALID_MODEL');
  const preset=estimates.filter(n=>n.kind==='preset'),generated=estimates.filter(n=>n.kind==='generated');
  const coverage={nodeBaseUnits:{covered:estimates.length,total:estimates.length},presetDisplayText:{covered:preset.filter(n=>n.coverage.displayReviewed).length,total:preset.length},
    presetExecutableConditions:{covered:0,total:preset.length},generatedGoalQuantityFields:{covered:generated.reduce((s,n)=>s+n.coverage.generatedGoalQuantities.covered,0),total:generated.reduce((s,n)=>s+n.coverage.generatedGoalQuantities.total,0)},
    generatedDetailedConditions:{covered:0,total:generated.reduce((s,n)=>s+n.coverage.generatedDetailedConditions.total,0),status:'unknown'},
    unmodeledGeneratedFields:unique(generated.flatMap(n=>n.coverage.unmodeledGeneratedFields))};
  const unknowns=unique(['D参数情景范围，不是统计置信区间；规划工作单位不换算真实分钟、对局或货币。','预设估计不能区分节点数与已核特征相同的路线细节。','未统计目标内部部分进度；剩余量按完整节点完成记录扣减。',
    ...(generated.length?['相同大类与数量的不同容器、生产物品、武器/装备条件和地点可能得到相同粗估；当前尚未评价这些细节成本。']:[]),...estimates.flatMap(n=>n.unknowns)]);
  if(!isSufficient)return {...metric(null,'planning_work_unit',[...basis,'星数不足，不把局部选择当完整阶段路线评价'],'unknown',null,coverage,[...unknowns,'所选与已结来源并集未达到阶段门槛']),...display};
  return {...metric(round(totals.value),'planning_work_unit',basis,'planning_estimate',{low:round(totals.low),high:round(totals.high),kind:'parameter_scenario_range'},coverage,unknowns),parameterVersion:model.parameterVersion,precision:'coarse_node_level_D',...display};
}
function realWorldUnknowns(){
  return Object.fromEntries([
    ['N','raid','缺完整目标事件、可执行排程、失败重试及真实对局日志；节点数不等于对局数'],
    ['T','minutes','缺真实主动时间与路线用时；按钮时间不是玩家耗时'],
    ['L','hours','缺真实上线/生产关键路径、开放时序及完整日历；不隐藏设定观察窗'],
    ['F','probability','缺失败率、重试与超时样本'],
    ['G','net_currency','缺价格、材料/上交消耗与装备净损失；生成费0不代表任务成本0'],

function evaluateStageRoute(request,context){
  try{
    exactKeys(request,['stage','selectedPresetLineIds','selectedGeneratedInstanceIds'],'评价请求');
    exactKeys(context,['factCatalog','generatedInstances','progressSnapshot','modelConfig'],'评价上下文');
    must([1,2,3].includes(request.stage),'只评价阶段一至三','INVALID_REQUEST');
    const selectedPreset=request.selectedPresetLineIds??[],selectedGenerated=request.selectedGeneratedInstanceIds??[];
    must(Array.isArray(selectedPreset)&&selectedPreset.every(nonempty)&&Array.isArray(selectedGenerated)&&selectedGenerated.every(nonempty),'所选来源必须是ID数组','INVALID_REQUEST');
    const model=context.modelConfig??createDefaultModelConfig();validateModel(model);
    const facts=factRegistry(context.factCatalog),registry=makeRegistry(facts,context.generatedInstances),progress=readProgress(context.progressSnapshot,registry);
    const stage=facts.stages.get(request.stage),main=registry.refs.get(presetLineRef(stage.mainLineId));
    const selectedRefs=[];
    for(const id of unique(selectedPreset)){const source=registry.refs.get(presetLineRef(id));must(source&&source.stage===request.stage&&source.lineType!=='main','所选预设支线不存在、跨阶段或试图手选主线','INVALID_REQUEST');selectedRefs.push(source.ref);}
    for(const id of unique(selectedGenerated)){const source=registry.instances.get(id);must(source&&source.stage===request.stage,'所选自选实例不存在或跨阶段','INVALID_REQUEST');selectedRefs.push(source.ref);}
    const selected=unique(selectedRefs),settledRefs=[...progress.bySource.keys()].filter(ref=>registry.refs.get(ref).stage===request.stage);
    const effective=unique([...settledRefs,...selected]).sort(),fullRefs=[main.ref,...effective],fullLines=fullRefs.map(ref=>registry.refs.get(ref));
    const settledStars=settledRefs.reduce((s,ref)=>s+registry.refs.get(ref).stars,0),selectedOnlyStars=selected.reduce((s,ref)=>s+registry.refs.get(ref).stars,0);
    const selectedUnsettled=selected.filter(ref=>!progress.bySource.has(ref)),additionalSelectedStars=selectedUnsettled.reduce((s,ref)=>s+registry.refs.get(ref).stars,0);
    const attainableStars=settledStars+additionalSelectedStars,routeIsSufficient=attainableStars>=stage.threshold;
    const mainComplete=main.nodes.every(n=>progress.completed.has(n.ref)),actualStageQualified=mainComplete&&settledStars>=stage.threshold;

function costScaleMarkup(a,context){if(a.status!=='assessed')return '<div class="cost-scale-neutral"><b>'+esc(a.label)+'</b><small>'+esc(context?.comparison?.reason||a.reason)+'</small></div>';const n=v=>Number(v.toFixed(3)),bounds=a.ticks.slice(1),range=a.rangePositions;return '<div class="cost-assessment"><div class="cost-assessment-title"><b>'+esc(a.label)+(a.overflow?'！':'')+'</b><span>参照的 '+n(a.percentage)+'%</span></div><p class="cost-scale-reference">'+(context.section==='remaining'?'同状态剩余参照':'同阶段完整参照')+' '+n(a.referenceValue)+' WU = 100%</p><div class="cost-scale" role="img" aria-label="'+esc('当前'+n(a.value)+'WU，'+a.label+'，参照的'+n(a.percentage)+'%；绿色轻量、黄色常规、橙色较重、红色严重，超过150%为超高')+'"><div class="cost-scale-track">'+S.bands.map(b=>'<i class="cost-segment cost-tone-'+b.tone+'" style="width:'+((b.endRatio-b.startRatio)/a.axisMaximumRatio*100)+'%"></i>').join('')+a.ticks.map(t=>'<i class="cost-scale-tick" style="left:'+t.position+'%"></i>').join('')+'</div>'+(range?'<div class="cost-scenario-range" style="left:'+range.low+'%;width:'+(range.high-range.low)+'%"></div>':'')+'<span class="cost-current-marker '+a.className+'" style="left:'+a.position+'%" title="当前 '+n(a.value)+' WU">▲</span></div><div class="cost-band-labels">'+S.bands.map((b,i)=>'<div class="cost-tone-'+b.tone+'"><b>'+esc(b.label)+(b.tone==='extreme'?'！':'')+'</b><small>'+(i<4?(i===3?'≤':'＜')+n(bounds[i].value):'＞'+n(bounds[3].value))+'</small></div>').join('')+'</div><p class="cost-scale-key">分界单位：WU · ▲ 当前值 · 横线为情景范围'+(range?.clippedHigh?'（上界超出图示）':'')+'</p>'+(a.partial?'<p class="cost-scale-key">此处仅评价已量化部分。</p>':'')+'</div>';}
function metricGrid(values,context){const units={planning_work_unit:'WU',sequential_node:'节点',remaining_node:'节点',completed_node:'节点',stage_star:'星',line:'条',raid:'局',minutes:'分钟',hours:'小时',probability:'概率',net_currency:'净货币',competition_exposure:'竞争暴露',coordination_cost:'协调成本',reward_coverage_hours:'奖励覆盖'},statuses={computed:'结构计算',planning_estimate:'参数估计',unknown:'暂无数据',measured:'实测'},n=v=>Number(v.toFixed(3));return '<div class="metric-grid '+(metricArray(values).some(x=>x.key==='planningWorkload')?'cost-metric-grid':'')+'">'+metricArray(values).map(x=>{const wu=x.key==='planningWorkload',partial=x.quantityCoverageComplete===false,ref=context?.comparison?.reference?.[context?.section]?.planningWorkload?.value,a=wu?S.assess(x.value,{referenceValue:ref,comparisonAvailable:context?.comparison?.available===true,range:x.range,partial}):null;return '<article class="'+(wu?'cost-card '+a.className:'')+'"><span>'+esc(x.key==='nodeCount'?'任务节点数':wu?'已量化目标基础量'+(partial?'（部分）':''):x.label||x.name||x.key||x.id)+'</span><strong class="'+(wu?'wu-value':'')+'">'+esc(wu&&Number.isFinite(x.value)?n(x.value):formatMetric(x))+(wu&&Number.isFinite(x.value)?' <em>WU</em>':'')+(a?.overflow?'<span class="cost-overflow" aria-label="超出150%参照">!</span>':'')+'</strong>'+(wu&&x.range?'<small class="wu-point">情景范围 '+esc(formatMetric({range:x.range}))+' WU</small>':'')+'<small>'+esc(wu?'目标量记账':units[x.unit]||x.unit||'')+' <span class="metric-status '+esc(x.status||'')+'">'+esc(statuses[x.status]||'')+'</span></small>'+(wu?costScaleMarkup(a,context):'')+'</article>';}).join('')+'</div>';}
function renderComparison(c){if(!c)return '';if(!c.available)return '<p class="model-footnote">同状态参考暂不可比较：'+esc(c.reason||'目标量映射尚不完整。')+'</p>';const d=c.deltas?.remaining,diff=d?.difference?.value,ratio=d?.ratio?.value;return '<section class="reference-comparison"><h3 class="model-section-title">同状态目标量参考</h3><p class="route-state-note">同阶段、同一实际进度及已结来源；只在具有可比目标映射的足额预设路线中，按当前WU-D2重新选择剩余已量化基础量最低者。主线自动纳入。</p>'+metricGrid([{key:'workloadDelta',label:'剩余已量化量差',value:Number.isFinite(diff)?diff:null,unit:'WU',status:'planning_estimate'},{key:'workloadRatio',label:'目标量比（所选÷参考）',value:Number.isFinite(ratio)?ratio:null,unit:'倍',status:Number.isFinite(ratio)?'planning_estimate':'unknown'}])+'<p class="route-state-note">差值＝所选−参考；负数表示已量化量较少。比值以1为基准。公共主线中未量化目标在双方相同，比较仅覆盖已量化部分；不代表真实时间、资源或压力更低。</p>'+(!Number.isFinite(ratio)?'<p class="route-state-note">参考剩余量为0，无法计算比值。</p>':'')+'</section>';}
function evaluationExplanation(r){return W.explain(r,{catalog:F,generatedInstances:r?.plannerRecord?.generatedInstances||[]});}
function bandText(b){return typeof b==='string'?b:b?.label||'';}
function singleLineTone(b){return ({'轻量':'light','常规':'normal','较重':'heavy','重量较高':'severe','严重':'severe'})[bandText(b)]||'neutral';}
function pressureList(tags){return '<div class="wu-pressure-tags">'+(tags?.length?tags.map(t=>'<span>'+esc(typeof t==='string'?t:t.label||t.name||t.key)+'</span>').join(''):'<small>暂无已核压力标签；不据此判断低压力。</small>')+'</div>';}
function assessmentPanel(r){const x=evaluationExplanation(r);if(!x.ok)return '<p class="model-footnote">'+esc(x.reason)+'</p>';return '<section class="wu-assessment"><h3 class="model-section-title">单线目标量与压力条件</h3><p class="route-state-note">阶段三完整支线：＜12轻量 · 12–＜20常规 · 20–＜25较重 · ≥25重量较高。其他阶段与阶段总量暂不套档；目标未量化完整的线不分档。</p>'+x.lines.filter(l=>!catalog.lines.some(c=>'preset:'+c.id===l.ref&&c.type==='main')).map(l=>'<article class="wu-line-assessment"><div><strong>'+esc(l.name)+'</strong><b class="wu-value cost-tone-'+singleLineTone(l.band)+'">'+Number(l.full.point.toFixed(3))+' WU</b></div><p>'+esc(bandText(l.band)||'当前不分档')+' · 完整单线已量化量；当前剩余 '+Number(l.remaining.point.toFixed(3))+' WU</p>'+pressureList(l.pressureTags)+(l.coverage?.quantityCoverageComplete===false?'<p class="wu-coverage">本线有目标尚无动作单位，仅显示已量化部分。</p>':'')+'</article>').join('')+'<p class="route-state-note">轻量仅表示目标量较少；同局、撤离、稀有物品、PVP等条件单列，不乘分。“简单低压力”仍需结合这些条件与实际体验判断。</p><details class="wu-reference"><summary>查看六条S11任务参照</summary>'+anchorTable()+'</details></section>';}
function renderEvaluation(r){if(!r||r.status==='pending_configuration')return '<div class="model-empty"><h3>自动评价接口正在接入</h3></div>';if(r.ready===false)return '<div class="model-empty"><h3>当前路线暂不可评价</h3><p>'+esc(r.playerReason||r.error||'请检查所选路线和任务数据。')+'</p></div>';const full=r.fullPlanMetrics||r.metrics||[],remaining=r.remainingMetrics||[],unknown=r.realWorldMetrics||(r.fullPlanMetrics?r.metrics:[]),partial=r.fullPlan?.planningWorkload?.quantityCoverageComplete===false;return '<div class="model-result"><h3 class="model-section-title">完整来源计划 · 从零计算'+(partial?'已量化部分':'目标量')+'</h3>'+metricGrid(primaryMetrics(full),{comparison:r.comparison||r.raw?.comparison,section:'fullPlan'})+(metricArray(remaining).length?'<h3 class="model-section-title">当前剩余 · 按实际节点完成扣减</h3>'+metricGrid(primaryMetrics(remaining),{comparison:r.comparison||r.raw?.comparison,section:'remaining'}):'')+'<button class="button compact formula-entry" data-action="showCalculation">查看核算公式与过程</button><p class="model-footnote">WU-D2：真实与自选统一按目标数量记账；所有品质及限制条件仅作压力标签。'+(partial?'本计划含尚未量化目标，当前数值不是完整成本。':'')+'</p>'+assessmentPanel(r)+renderComparison(r.comparison||r.raw?.comparison)+(metricArray(unknown).length?'<details class="model-unknowns"><summary>真实成本维度 · 数据尚不足</summary>'+metricGrid(unknown)+'</details>':'')+'<p class="model-footnote">'+esc(r.disclaimer||'真实对局、时间与经济成本缺数据时保留未知。')+'</p></div>';}
function formatMetric(x){const v=x.range??x.value??x.interval,n=y=>typeof y==='number'?Number(y.toFixed(2)):y;if(Array.isArray(v))return v.map(n).join('–');if(v===null||v===undefined)return '未知';if(typeof v==='object')return v.low!==undefined?n(v.low)+'–'+n(v.high):v.min!==undefined?n(v.min)+'–'+n(v.max):'未知';return n(v);}
function plannerConfigPanel(){if(plannerStage===4)return '<section class="planner-panel"><h2>阶段四</h2><p>当前不配置自选任务生成。</p></section>';const settings=draftConfig.stages[plannerStage],all=C.getPlannerOptions();return '<div class="config-layout"><section class="planner-panel"><div class="section-title"><h2>可选地图</h2><span>玩家最多选择2张</span></div><div class="config-switches">'+all.maps.map(x=>configSwitch('map',x,settings.enabledMapIds.includes(x.id))).join('')+'</div><div class="section-title subsection"><h2>可选行为</h2><span>玩家最多选择3项</span></div><div class="config-switches">'+all.behaviors.map(x=>configSwitch('behavior',x,settings.enabledBehaviorIds.includes(x.id))).join('')+'</div></section><section class="planner-panel"><div class="section-title"><h2>难度倾向</h2><span>系统生成预设</span></div><div class="difficulty-choices">'+C.difficultyPresets.map(x=>'<label class="difficulty-choice '+(settings.difficultyPreset===x.id?'selected':'')+'"><input type="radio" name="difficulty" data-field="difficulty" value="'+x.id+'" '+(settings.difficultyPreset===x.id?'checked':'')+'><span><strong>'+x.name+'</strong><small>'+(x.id==='progressive'?'同类目标数量逐步增加，标杆固定1次。':'同类目标数量按平级预设生成。')+'</small></span></label>').join('')+'</div><p class="model-footnote">玩家只选择星数、行为和地图，任务线按本阶段已生效的倾向生成。不同类型不能仅凭次数比较真实难度，整线不保证逐节点更难。</p><div class="config-warning">'+(dirty?'配置有实际改动。应用后将清空全部玩家进度，并从阶段一重新开始。':'当前配置未改动。退出策划模式不会改变玩家进度。')+'</div><button class="button primary" data-action="applyConfig" '+(!dirty?'disabled':'')+'>应用配置并重置玩家进度</button></section></div>';}
function configSwitch(kind,x,checked){return '<label class="config-switch"><span>'+esc(x.name)+'</span><input type="checkbox" data-field="config-'+kind+'" value="'+x.id+'" '+(checked?'checked':'')+'><i></i></label>';}
function packageConfigPanel(){if(plannerStage===4)return '';const stage=plannerStage,stars=C.stageProfiles[stage].stars,settings=draftConfig.stages[stage].packages;return '<section class="planner-panel package-config-panel"><div class="section-title"><h2>固定任务包配置</h2><span>本阶段各类型1包 · 与详细自选开关独立</span></div><p class="route-state-note">可调整本阶段三包的星数、各节点目标类型及数量；节点数量与地图范围保持固定。草稿不会改变玩家任务，应用后统一校验并重置全部表层进度，包括已接任务包。</p><div class="package-config-grid">'+P.list(stage).map(pack=>{const row=settings[pack.id],choices=P.goalOptions(pack.id);return '<section class="package-config-item"><header><div><b>'+esc(pack.name)+'</b><small>'+esc(pack.level)+' · '+esc(pack.mapLabel)+'</small></div><label>星数 <select data-field="package-stars" data-package="'+esc(pack.id)+'">'+stars.map(n=>'<option value="'+n+'" '+(row.stars===n?'selected':'')+'>'+n+' ★</option>').join('')+'</select></label></header><div class="package-node-grid">'+row.nodes.map((node,i)=>'<div class="package-node-edit"><span>'+String(i+1).padStart(2,'0')+'</span><select data-field="package-goal" data-package="'+esc(pack.id)+'" data-index="'+i+'" aria-label="'+esc(pack.name)+'第'+(i+1)+'节点目标类型">'+choices.map(c=>'<option value="'+esc(c.id)+'" '+(node.goalType===c.id?'selected':'')+'>'+esc(c.label)+'</option>').join('')+'</select><label>数量 <input type="number" min="1" max="99" step="1" data-field="package-quantity" data-package="'+esc(pack.id)+'" data-index="'+i+'" value="'+esc(node.quantity)+'" aria-label="'+esc(pack.name)+'第'+(i+1)+'节点目标数量"></label></div>').join('')+'</div></section>';}).join('')+'</div><p class="route-state-note">星数须为本阶段合法星档，且交战 ≥ 扫荡 ≥ 搜索；每包两个主题目标均须出现，数量为1—99的整数。保存时统一校验，不合规则不应用。</p></section>';}
function packageCostHint(){if(plannerStage===4)return '';const stage=plannerStage,settings=draftConfig.stages[stage].packages,units=M.parameters.goalUnits,base=M.parameters.commonNodeBaseByStage[stage],packs=P.list(stage),rows=packs.map(pack=>{const data=settings[pack.id],value=data.nodes.reduce((sum,node)=>sum+base+(units[node.goalType]||0)*Number(node.quantity),0);return {name:pack.name,value,ok:data.nodes.every(node=>Number.isInteger(node.quantity)&&node.quantity>0&&Number.isFinite(units[node.goalType]))};}),max=Math.max(...rows.map(row=>row.value),1),ordered=rows.every((row,i)=>i===0||rows[i-1].value>=row.value),valid=C.validatePlannerConfig(draftConfig).ok;return '<section class="planner-panel package-wu-panel"><div class="section-title"><h2>任务包目标量预检</h2><span>当前草稿 · WU-D2</span></div><p class="route-state-note">只看节点基础量与动作数量，不代表真实难度、耗时或失败压力；星数是进度贡献，不直接换算为 WU。</p><div class="package-wu-grid">'+rows.map(row=>'<div><span>'+esc(row.name)+'</span><strong>'+(row.ok?row.value.toFixed(2):'待修正')+'<small> WU</small></strong><i style="width:'+Math.max(0,Math.min(100,row.value/max*100))+'%"></i></div>').join('')+'</div>'+(!valid?'<p class="package-wu-warning">草稿尚未通过配置校验，无法应用；请修正星档、主题覆盖或数量。</p>':!ordered?'<p class="package-wu-warning">当前已量化目标量与高／中／低标签顺序不一致。此处只提示，仍须结合限制和体验判断。</p>':'<p class="package-wu-note">当前已量化目标量按高、中、低排列；压力等级仍需体验验证。</p>')+'</section>';}
function clockPanel(){const active=[1,2,3].map(n=>book(n).custom).filter(a=>a&&!a.settled);return '<section class="planner-panel clock-panel"><div><div class="eyebrow">DEMO CLOCK</div><h2>演示时间</h2><p>第'+Math.floor(state.clock.elapsedMinutes/1440)+'天 '+String(Math.floor(state.clock.elapsedMinutes%1440/60)).padStart(2,'0')+':'+String(state.clock.elapsedMinutes%60).padStart(2,'0')+' · 完成任务不推进时间</p></div><div class="clock-buttons"><button class="button compact" data-action="advanceTime" data-minutes="60">推进1小时</button><button class="button compact" data-action="advanceTime" data-minutes="1440">推进1天</button><button class="button compact" data-action="expire" '+(!active.length?'disabled':'')+'>推进至下一条到期</button></div></section>';}
function plannerShell(){return '<header class="planner-topbar"><div><span class="planner-label">策划模式</span><h1>自选任务 · 系统内核</h1></div><button class="button" data-action="exitPlanner">退出策划模式 '+icon('close')+'</button></header><main class="planner-surface" id="planner-surface"><div class="planner-stage-tabs" aria-label="策划查看阶段">'+[1,2,3,4].map(n=>'<button class="'+(n===plannerStage?'selected':'')+'" data-action="plannerStage" data-stage="'+n+'">0'+n+' 阶段'+numbers[n]+' · '+names[n]+'</button>').join('')+'</div><div class="planner-section-tabs"><button class="'+(plannerTab==='evaluation'?'selected':'')+'" data-action="plannerTab" data-tab="evaluation">路线评价</button><button class="'+(plannerTab==='config'?'selected':'')+'" data-action="plannerTab" data-tab="config">生成配置'+(dirty?' · 未应用':'')+'</button><p>评价使用已生效配置'+(dirty?'；未应用改动仅保留在生成配置页':'；选线不改变玩家进度')+'</p></div>'+'<p class="route-state-note">WU-D2 · 用户采纳的目标量计分与压力标签；单线分档为阶段三试评参照。</p>'+(C.cfgAuthority?.developmentOnly?'<p class="route-state-note">PROVISIONAL · 配置联调版，曲线口径待确认；尚未锁版。</p>':'')+(plannerTab==='evaluation'?evaluation():plannerConfigPanel()+packageConfigPanel()+packageCostHint())+clockPanel()+'</main>';}

function currentAnchorRows(){return ['S11-AP-P3-S01','S11-AP-P3-S02','S11-AP-P3-S04','S11-AP-P3-B07','S11-AP-P3-B08','S11-AP-P3-S05'].map(id=>{const line=M.scorePresetLine(id,{catalog:F});return {name:line.name,nodes:line.full.nodes,point:line.full.point,band:bandText(line.band)||'当前不分档',tone:singleLineTone(line.band)};});}
function anchorTable(){return '<div class="calc-table-wrap"><table class="calc-table"><thead><tr><th>阶段三完整支线</th><th>目标量WU</th><th>基础量档</th></tr></thead><tbody>'+currentAnchorRows().map(r=>'<tr><td>'+esc(r.name)+'</td><td class="wu-value cost-tone-'+r.tone+'">'+r.point+'</td><td>'+r.band+'</td></tr>').join('')+'</tbody></table></div><p class="route-state-note">收集参照为精致人生、风卷残云；阿萨拉之星是调查/取物/撤离混合线。仅比较目标量，不代表相同真实压力。</p>';}
function calculationBody(x){if(!x?.ok)return '<p>'+esc(x?.reason||'核算依据暂不可用。')+'</p>';const n=v=>Number(v.toFixed(3)),summary=t=>n(t.point)+' WU（'+n(t.low)+'–'+n(t.high)+'）',expression=r=>n(r.base)+r.terms.map(t=>' + '+t.quantity+'×'+t.unit+'['+t.label+']').join('')+' = '+n(r.value)+' WU',units=window.DemoWUData.parameters;return '<p class="calculation-scope">'+esc(x.scope)+'。参数版本：'+esc(x.parameterVersion)+'</p>'+(x.coverage?.quantityCoverageComplete===false?'<p class="wu-coverage">本计划有 '+x.coverage.unmodeledObjectiveCount+' 项目标尚无动作单位，以下仅为已量化部分；未量化项目没有按0处理。</p>':'')+'<div class="calc-summary"><article><small>完整来源已量化量</small><strong>'+esc(summary(x.full))+'</strong></article><article><small>已完成，扣除</small><strong>'+esc(summary(x.completed))+'</strong></article><article><small>当前剩余已量化量</small><strong>'+esc(summary(x.remaining))+'</strong></article></div><p class="calc-equation">'+n(x.full.point)+' − '+n(x.completed.point)+' = '+n(x.remaining.point)+' WU</p><details class="calc-method" open><summary>单位、公式与范围依据</summary><p>WU是目标基础量的参数记账单位，不换算实际局数、时间或货币。真实与自选使用同一公式：节点WU＝阶段节点基础＋Σ(目标数量×动作单位)，整线为节点之和。</p><p>阶段一/二/三节点基础＝0.5/0.625/0.75。品质、同局、成功撤离、装备和地点等限制均只列压力标签，不叠乘。整阶段成本卡另按对应预设参照的80%/100%/125%/150%显示量级与颜色；完整和剩余分别使用对应参照，未量化部分不作完整难度判断。任务物品动作组展开获取0.25＋放置0.30＋转交0.25，不再重复加0.8。</p><div class="calc-table-wrap"><table class="calc-table"><thead><tr><th>动作</th><th>WU/动作单位</th></tr></thead><tbody>'+Object.entries(units.goalUnits).map(([key,v])=>'<tr><td>'+esc(units.goalUnitLabels[key]||key)+'</td><td>'+v+'</td></tr>').join('')+'</tbody></table></div><p>情景范围＝已量化基础量×0.7–×1.8，仅作参数情景检视，不是置信区间，不保证覆盖未建模成本。没有动作单位的目标保持未知，不以0计入，不因低小计分为轻量。已完成节点逐项从原计划扣除。</p></details><details class="calc-method"><summary>阶段三单线分档与六线参照</summary><p>＜12轻量，12–＜20常规，20–＜25较重，≥25重量较高。只用于阶段三完整单条支线，阶段总计划不套档。轻量不自动等于简单低压力。</p>'+anchorTable()+'</details>'+x.lines.map(l=>'<details class="calc-line"><summary>'+esc(l.name)+' · 完整 '+n(l.full.point)+' WU / 剩余 '+n(l.remaining.point)+' WU'+(bandText(l.band)?' · '+esc(bandText(l.band)):'')+'</summary>'+pressureList(l.pressureTags)+l.nodes.map(r=>'<article class="calc-node '+(r.completed?'completed':'')+'"><h4>'+esc(r.title)+' <span>'+(r.completed?'已完成，剩余中扣除':'尚待完成')+'</span></h4><p>'+r.objectives.map(esc).join('<br>')+'</p><code>'+esc(expression(r))+'</code>'+r.terms.map(t=>'<small>'+esc(t.label)+'：数量 '+t.quantity+' × 单位 '+t.unit+' WU'+(t.sourceObjective?' · 原目标'+t.sourceObjective:'')+(t.quantityBasis?' · '+esc(t.quantityBasis):'')+'</small>').join('')+'<small>情景范围 '+n(r.range[0])+'–'+n(r.range[1])+' WU · '+esc(r.nodeRef)+'</small>'+pressureList(r.pressureTags)+(r.unknownObjectives?.length?'<p class="wu-coverage">未量化目标：'+r.unknownObjectives.map(t=>esc(typeof t==='string'?t:t.reason||t.description||JSON.stringify(t))).join('；')+'。这些项目没有按0处理。</p>':'')+'</article>').join('')+'</details>').join('')+(x.comparison?'<details class="calc-method"><summary>同状态参考差值与比值</summary><p>'+n(x.comparison.selectedValue)+' − '+n(x.comparison.referenceValue)+' = '+n(x.comparison.difference.value)+' WU</p><p>'+n(x.comparison.selectedValue)+' ÷ '+n(x.comparison.referenceValue)+' = '+(Number.isFinite(x.comparison.ratio.value)?n(x.comparison.ratio.value)+'倍':'未知（参考为0，不能相除）')+'</p></details>':'')+'<details class="calc-method"><summary>未量化项目与当前模型限制</summary><ul>'+x.unknowns.map(t=>'<li>'+esc(typeof t==='string'?t:JSON.stringify(t))+'</li>').join('')+'</ul></details>';}
function renderModal(){if(!modal)return '';if(['package','packageDetail','builder'].includes(modal.type)){const heading=modal.type==='package'?'选择自选任务':modal.type==='packageDetail'?'确认任务包':'详细自选任务';return '<div class="modal-backdrop"><section class="modal custom-flow-modal" role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-title"><header><div><small>行动计划 / 阶段'+numbers[viewStage]+' / 自选支线</small><h2 id="modal-title">'+heading+'</h2></div><button class="icon-button" data-action="closeModal" aria-label="关闭自选任务弹窗">×</button></header><div class="modal-body">'+(modal.type==='package'?packagePicker():modal.type==='packageDetail'?packagePreview():builder())+'</div></section></div>';}if(modal.type==='calculation'||modal.type==='evaluationCustom')return '<div class="modal-backdrop"><section class="modal calculation-modal" role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title">'+(modal.type==='calculation'?'WU核算公式与过程':'本次评价的自选内容')+'</h2><button class="icon-button" data-action="closeModal" aria-label="关闭核算详情">×</button></header><div class="modal-body">'+(modal.type==='calculation'?calculationBody(modal.explanation):modal.config?'<p>来源：'+(modal.config.instanceId?'玩家已接取实例':'玩家明确生成的完整预览，尚未接取')+'</p>'+renderGenerated(modal.config):'<p>当前没有已生成的自选线。</p>')+'</div><footer><button class="button" data-action="closeModal">返回评价</button></footer></section></div>';if(modal.type==='confirm')return '<div class="modal-backdrop"><section class="modal" role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title">'+esc(modal.title)+'</h2><button class="icon-button" data-action="closeModal" aria-label="关闭">×</button></header><div class="modal-body"><p>'+esc(modal.message)+'</p></div><footer><button class="button" data-action="closeModal">返回</button><button class="button primary" data-action="confirmModal">'+esc(modal.confirm||'确认')+'</button></footer></section></div>';
 const l=modal.type==='preset'?catalog.lines.find(x=>x.id===modal.lineId):null,a=modal.type==='custom'?book(modal.stage).custom:null;if(!l&&!a)return '';const nodes=l?l.nodeDetails:a.config.nodes,p=l?book(l.stage).presets[l.id]:a,current=p.nodeIndex,readonly=l?.stage===4;return '<div class="modal-backdrop"><section class="modal line-modal" role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-title"><header><div><small>'+(l?(l.type==='main'?'主线任务':'支线任务'):'自选任务')+' · '+current+' / '+nodes.length+'</small><h2 id="modal-title">'+esc(l?.name||a.config.title||a.config.name||'自选任务')+'</h2></div><button class="icon-button" data-action="closeModal" aria-label="关闭任务线">×</button></header><div class="modal-body node-list">'+nodes.map((n,i)=>'<article class="detail-node '+(i===current?'is-current':i<current?'is-complete':'')+'"><span class="node-index">'+(i<current?'✓':String(i+1).padStart(2,'0'))+'</span><div><small>'+(i<current?'已完成':i===current&&!readonly?'当前已接取':'后续任务')+'</small><h3>'+esc(title(n))+'</h3><div class="tags">'+tags(n)+'</div>'+goalList(n)+(i===current&&!readonly?'<button class="button primary compact" data-action="'+(l?'completePreset':'completeCustom')+'" '+(l?'data-line="'+l.id+'"':'data-stage="'+a.stage+'" data-instance="'+a.instanceId+'"')+' data-node="'+n.id+'" '+(!canComplete(n)?'disabled':'')+'>完成任务</button>':'')+'</div></article>').join('')+'</div><footer><span>'+(p.settled?'整条任务线已完成':a?timer(a):'按顺序完成已接取的当前任务')+'</span><button class="button" data-action="closeModal">返回</button></footer></section></div>';}
let modalReturnFocus=null,renderedModalType=null,renderedBuildStep=null;
function focusSelector(el){if(!el?.dataset?.action&&!el?.dataset?.field)return null;const key=el.dataset.action?'action':'field';return '[data-'+key+'="'+CSS.escape(el.dataset[key])+'"]'+['value','kind','stage','line','step','package','index'].filter(k=>el.dataset[k]!==undefined).map(k=>'[data-'+k+'="'+CSS.escape(el.dataset[k])+'"]').join('');}
function render(){const active=document.activeElement,activeSelector=focusSelector(active),wasModal=renderedModalType!==null,sameView=renderedModalType===modal?.type&&(modal?.type!=='builder'||renderedBuildStep===buildStep),bodyScroll=$('#modal-root .modal-body')?.scrollTop||0;
 if(modal&&!wasModal)modalReturnFocus=activeSelector;
 document.body.classList.toggle('planner-mode',mode==='planner');$('#app').innerHTML=mode==='planner'?plannerShell():playerShell();$('#modal-root').innerHTML=renderModal();document.body.classList.toggle('modal-open',!!modal);$('#app').inert=!!modal;
 if(modal){if(sameView&&$('#modal-root .modal-body'))$('#modal-root .modal-body').scrollTop=bodyScroll;const target=sameView&&activeSelector?$('#modal-root '+activeSelector):null;(target&&!target.disabled?target:$('#modal-root [role="dialog"]'))?.focus({preventScroll:true});}
 else if(wasModal){const target=modalReturnFocus?$(modalReturnFocus):null;(target||$('.custom-entry'))?.focus({preventScroll:true});modalReturnFocus=null;}
 else if(mode==='planner'&&activeSelector)$(activeSelector)?.focus({preventScroll:true});
 renderedModalType=modal?.type||null;renderedBuildStep=buildStep;
}
function closeModal(){modal=modal?.returnTo||null;page='tasks';render();saveView();}
function openConfirm(title,message,onConfirm,confirm){const previous=modal;modal={type:'confirm',title,message,onConfirm,confirm,returnTo:previous&&['package','packageDetail','builder'].includes(previous.type)?previous:null};render();}
function resetViews(){evaluationCustomBindings={};evaluationObservedInstances={};evaluationSelectionNotices={};evaluationResults={};generatedRequests={};buildDrafts={};previews={};generationError='';buildStep=0;page='tasks';viewStage=1;notice='';try{localStorage.removeItem(VIEW_KEY);}catch(e){}}
function runGenerate(){const d=draft(buildStage);if(!buildValid(d)){toast('请先选择星数、至少一项行为和一张地图。');return;}const r=G.generate(draftInput(d),{plannerConfig:state.designerConfig});previews[buildStage]=r;generationError=r.reason||r.errors?.join('；')||'';if(r.ok){generatedRequests[buildStage]={input:draftInput(d),configSignature:state.configSignature,generationSignature:GENERATION_KEY,observedInstanceId:book(buildStage).custom?.instanceId||null};buildStep=3;}else delete generatedRequests[buildStage];render();if(!r.ok)toast(r.reason||r.errors?.[0]||'当前条件需要调整。');}
function onAction(el){const a=el.dataset.action,stage=Number(el.dataset.stage);if(a==='closeModal'){closeModal();return;}if(a==='confirmModal'){const fn=modal?.onConfirm;modal=null;fn?.();return;}if(a==='openPlanner'){mode='planner';draftConfig=clone(state.designerConfig);dirty=false;plannerStage=viewStage;modal=null;render();return;}if(a==='exitPlanner'){const exit=()=>{mode='player';modal=null;draftConfig=null;dirty=false;render();};if(dirty)openConfirm('放弃未应用的配置？','返回玩家界面后继续保留原有配置与全部进度。',exit,'放弃改动并退出');else exit();return;}
 if(a==='plannerStage'){plannerStage=stage;render();return;}if(a==='plannerTab'){plannerTab=el.dataset.tab;render();return;}if(a==='applyConfig'){const checked=typeof C.validatePlannerConfig==='function'?C.validatePlannerConfig(draftConfig):{ok:true,config:draftConfig};if(!checked.ok){toast(checked.reason||'请保留有效的地图和行为配置。');return;}openConfirm('应用配置并重置全部进度？','所有阶段、任务与自选线将回到起点；新的可选项与难度倾向同时生效。',()=>{const r=E.applyDesignerConfig(state,checked.config||draftConfig);if(r.ok){save();resetViews();draftConfig=clone(state.designerConfig);dirty=false;evaluationSelections={};}render();toast(r.message);},'应用并重置');return;}
 if(a==='advanceTime'){actionResult(E.advanceTime(state,Number(el.dataset.minutes)));return;}if(a==='expire'){actionResult(E.advanceToNextExpiry(state));return;}if(a==='showCalculation'){const result=evaluationResults[plannerStage],explanation=W.explain(result,{catalog:F,generatedInstances:result?.plannerRecord?.generatedInstances||[]});modal={type:'calculation',explanation};render();return;}if(a==='showEvaluationCustom'){modal={type:'evaluationCustom',config:evaluationSpec(plannerStage)};render();return;}
 if(mode!=='player')return;
 if(a==='home'||a==='tasks'){page='tasks';modal=null;render();return;}if(a==='viewStage'){if(book(stage).entered){viewStage=stage;page='tasks';buildStep=0;modal=null;render();}return;}if(a==='nextStage'){const r=E.enterNextStage(state);if(r.ok){viewStage=state.playerStage;page='tasks';buildStep=0;}actionResult(r);return;}
 if(a==='openPackages'){if(viewStage>=4)return;modal={type:'package'};render();return;}if(a==='returnPackages'){modal={type:'package'};render();return;}if(a==='openPackageDetail'){if(!P.list(viewStage,state.designerConfig).some(x=>x.id===el.dataset.package))return;modal={type:'packageDetail',packageId:el.dataset.package};render();return;}
 if(a==='builder'){if(viewStage>=4)return;buildStage=viewStage;buildStep=clampBuildStep(draft(buildStage),buildStep);modal={type:'builder'};render();return;}if(a==='openLine'){modal={type:'preset',lineId:el.dataset.line};render();return;}if(a==='openCustom'){modal={type:'custom',stage};render();return;}
 if(a==='completePreset'){actionResult(E.completePresetNode(state,el.dataset.line,el.dataset.node));return;}if(a==='completeCustom'){actionResult(E.completeCustomNode(state,stage,el.dataset.node,el.dataset.instance));return;}
 if(a==='selectStar'){draft().stars=Number(el.dataset.value);delete previews[buildStage];delete generatedRequests[buildStage];render();return;}if(a==='toggleChoice'){const d=draft(),key=el.dataset.kind,value=el.dataset.value,max=key==='maps'?2:3;if(d[key].includes(value))d[key]=d[key].filter(x=>x!==value);else if(d[key].length<max)d[key].push(value);else return toast('最多选择'+max+(key==='maps'?'张地图。':'项行为。'));delete previews[buildStage];delete generatedRequests[buildStage];render();return;}
 if(a==='buildNext'){if(buildStep<2&&selectionStepValid(draft(),buildStep))buildStep++;render();return;}if(a==='buildBack'){if(buildStep){buildStep--;render();}else{modal={type:'package'};render();}return;}if(a==='buildStep'){buildStep=clampBuildStep(draft(),Number(el.dataset.step));render();return;}if(a==='generate'){runGenerate();return;}
 if(a==='acceptPackage'){const pack=P.list(viewStage,state.designerConfig).find(x=>x.id===el.dataset.package),config=pack?P.getConfig(viewStage,pack.id,state.designerConfig):null;if(!config)return;const old=book(viewStage).custom,start=()=>{const r=old&&!old.settled?E.rebuildCustomLine(state,config,old.instanceId):E.startCustomLine(state,config);if(r.ok){delete generatedRequests[viewStage];delete previews[viewStage];delete buildDrafts[viewStage];buildStep=0;modal=null;}actionResult(r);};if(old&&!old.settled)openConfirm('替换当前自选任务？','旧线未结算进度将清除，已结算的阶段星数保留。新任务包从确认接取起有效3天。',start,'替换并接取');else start();return;}
 if(a==='acceptCustom'){const g=playerPreview(buildStage);if(!g?.ok)return;const old=book(buildStage).custom;const start=()=>{const r=old&&!old.settled?E.rebuildCustomLine(state,g.config,old.instanceId):E.startCustomLine(state,g.config);if(r.ok){delete generatedRequests[buildStage];delete previews[buildStage];delete buildDrafts[buildStage];page='tasks';buildStep=0;modal=null;}actionResult(r);};if(old&&!old.settled)openConfirm('替换当前自选任务？','当前自选任务未结算进度将清空，已结算的阶段星数保留。新任务从接取时计3天。',start,'接取新任务');else start();return;}
}
function updateDirty(){const checked=C.validatePlannerConfig(draftConfig);dirty=!checked.ok||JSON.stringify(E.normalizeDesignerConfig(checked.config))!==JSON.stringify(E.normalizeDesignerConfig(state.designerConfig));}
function onChange(el){const field=el.dataset.field;if(mode!=='planner'||!field)return;const stage=plannerStage;if(field==='route'){if(el.value==='custom'&&el.checked)delete evaluationSelectionNotices[stage];const ids=selectedIds(stage);evaluationSelections[stage]=el.checked?[...ids,el.value]:ids.filter(x=>x!==el.value);render();return;}
 if(['package-stars','package-goal','package-quantity'].includes(field)){const pack=el.dataset.package,row=draftConfig?.stages?.[stage]?.packages?.[pack],index=Number(el.dataset.index);if(!row)return;if(field==='package-stars')row.stars=Number(el.value);else if(Number.isInteger(index)&&index>=0&&index<row.nodes.length){if(field==='package-goal')row.nodes[index].goalType=el.value;else row.nodes[index].quantity=el.value===''?0:Number(el.value);}updateDirty();render();return;}
 if(field==='config-map'||field==='config-behavior'){const key=field==='config-map'?'enabledMapIds':'enabledBehaviorIds',arr=draftConfig.stages[stage][key];draftConfig.stages[stage][key]=el.checked?[...new Set([...arr,el.value])]:arr.filter(x=>x!==el.value);updateDirty();render();return;}if(field==='difficulty'){draftConfig.stages[stage].difficultyPreset=el.value;updateDirty();render();return;}
}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(el){ev.preventDefault();if(!el.disabled){onAction(el);if(mode==='player')saveView();}}});document.addEventListener('change',ev=>onChange(ev.target));document.addEventListener('keydown',ev=>{if(!modal)return;if(ev.key==='Escape'){ev.preventDefault();closeModal();return;}if(ev.key==='Tab'){const dialog=$('#modal-root [role="dialog"]'),items=[...dialog.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),[tabindex="0"]')].filter(el=>el.getClientRects().length),first=items[0],last=items.at(-1);if(!first){ev.preventDefault();dialog.focus();return;}if(ev.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&(document.activeElement===last||document.activeElement===dialog)){ev.preventDefault();first.focus();}}});
window.addEventListener('storage',ev=>{if(ev.key!==KEY||!ev.newValue)return;try{const next=JSON.parse(ev.newValue);if(E.validateState(next,{catalog,generationSignature:GENERATION_KEY}))return;const configChanged=next.configSignature!==state.configSignature;state=next;modal=null;if(configChanged){resetViews();evaluationSelections={};if(mode==='planner'){draftConfig=clone(state.designerConfig);dirty=false;}}else if(!book(viewStage).entered)viewStage=state.playerStage;render();toast('进度已同步。');}catch(e){}});
restoreView();render();if(notice)toast(notice);
})();

</script>
